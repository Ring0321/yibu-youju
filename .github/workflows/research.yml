name: Research and publication checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Show Python runtime
        run: python3 --version
      - name: Run synthetic mechanism tests
        run: python3 -m unittest discover -s research -p 'test_*.py' -v
      - name: Check publication hygiene and source hashes
        run: python3 scripts/check_publication.py
