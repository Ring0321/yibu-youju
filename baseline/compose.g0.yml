name: yibu-g0

services:
  db:
    image: public.ecr.aws/docker/library/postgres:18@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
    environment:
      POSTGRES_DB: yibu_g0_test
      POSTGRES_USER: yibu_g0
      POSTGRES_PASSWORD: ${G0_DB_PASSWORD:?Run scripts/initialize-g0.ps1}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yibu_g0 -d yibu_g0_test"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - g0-db:/var/lib/postgresql

  tests:
    image: yibu-g0-tests:local
    build:
      context: .
      dockerfile: backend/Dockerfile.g0
    env_file: .env.g0
    environment:
      DATABASE_URL: postgresql://yibu_g0:${G0_DB_PASSWORD}@db:5432/yibu_g0_test
      PROJECT_NAME: Yibu G0 isolated validation
      FIRST_SUPERUSER: g0-admin@example.com
      FASTAPI_ENV: development
      SENTRY_DSN: ""
      SMTP_HOST: ""
      EMAILS_FROM_EMAIL: g0-noreply@example.com
      YIBU_G0_PROBE: "1"
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${G0_EVIDENCE_DIR:-./evidence/yibu-g0}:/evidence
    command: ["python", "/app/backend/scripts/g0_verify.py"]

volumes:
  g0-db:
